[package]
name = "postit-rs"
version = "0.1.0"
edition = "2024"
description = "Post-it app that shows on boot/wake with full graphical customization"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/postit-rs"
readme = "README.md"
keywords = ["post-it", "note", "startup", "wake", "egui", "overlay"]
categories = ["gui", "desktop-environment", "command-line-utilities"]

[dependencies]
# GUI Framework
eframe = { version = "0.29", features = ["default", "accesskit", "persistence"] }
egui = { version = "0.29", features = ["default", "accesskit"] }

# Config parsing
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.7"
directories = "5.0"  # Cross-platform config/data directories

# Font handling
fontdb = "0.13"  # System font discovery + custom font loading
ab_glyph = "0.2"  # Alternative font rasterizer

# System integration (Linux)
#[cfg(target_os = "linux")]
dbus = "0.9"
#[cfg(target_os = "linux")]
zvariant = "4.0"

# System integration (Windows)
#[cfg(target_os = "windows")]
windows = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
] }

# System integration (macOS) - optional, use objc2 when available
# #[cfg(target_os = "macos")]
# objc2 = "0.6"
# #[cfg(target_os = "macos")]
# objc2-foundation = "0.6"
# #[cfg(target_os = "macos")]
# objc2-app-kit = "0.6"

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "process", "sync"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Window handle abstraction
raw-window-handle = "0.6"

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
notify = "6.1"  # Config file watching
dirs = "5.0"  # Alternative to directories crate
image = "0.25"  # For loading background images
walkdir = "2.4"  # For font directory scanning
rand = "0.8"  # For random content selection

[build-dependencies]
#[cfg(target_os = "windows")]
embed-resource = "1.8"
#[cfg(target_os = "windows")]
winres = "0.1"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
panic = "abort"